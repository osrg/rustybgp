global:
  config:
    as: 65001
    router-id: "172.30.20.1"
  # Both peers are eBGP. Without this, the path that arrives first stays
  # the best path (RFC 5004), and the test cannot know which one it is.
  route-selection-options:
    config:
      external-compare-router-id: true

neighbors:
  - config:
      neighbor-address: "172.30.20.2"
      peer-as: 65002
    afi-safis:
      - config:
          afi-safi-name: ipv4-unicast

  - config:
      neighbor-address: "172.30.20.3"
      peer-as: 65003
    afi-safis:
      - config:
          afi-safi-name: ipv4-unicast
