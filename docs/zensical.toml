# Zensical configuration for the RustyBGP documentation site.
#
# Build locally from this directory:
#   uvx zensical serve     # live preview on http://localhost:8000
#   uvx zensical build     # static site in docs/site/

[project]
site_name = "RustyBGP"
site_description = "A high-performance BGP daemon written in Rust, compatible with GoBGP's gRPC API and configuration."
site_url = "https://osrg.github.io/rustybgp/"
copyright = "Copyright &copy; RustyBGP contributors. Licensed under the Apache License 2.0."

repo_url = "https://github.com/osrg/rustybgp"
repo_name = "rustybgp"
edit_uri = "edit/master/docs/content/"

docs_dir = "content"
site_dir = "site"

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    "getting-started/index.md",
    "getting-started/installation.md",
    "getting-started/quick-start.md",
  ] },
  { "Architecture" = [
    "architecture/index.md",
    "architecture/crates.md",
    "architecture/concurrency.md",
    "architecture/route-processing.md",
    "architecture/policy-engine.md",
    "architecture/kernel-integration.md",
    "architecture/subsystems.md",
  ] },
  { "User Guide" = [
    "user-guide/index.md",
    "user-guide/configuration-basics.md",
    "user-guide/neighbors.md",
    "user-guide/address-families.md",
    "user-guide/policy.md",
    "user-guide/route-reflection-and-route-servers.md",
    "user-guide/graceful-restart.md",
    "user-guide/rpki.md",
    "user-guide/bfd.md",
    "user-guide/monitoring.md",
    "user-guide/kernel-fib.md",
  ] },
  { "Administration" = [
    "administration/index.md",
    "administration/deployment.md",
    "administration/command-line.md",
    "administration/configuration-reload.md",
    "administration/operations.md",
    "administration/security.md",
    "administration/troubleshooting.md",
  ] },
  { "Automation" = [
    "automation/index.md",
    "automation/grpc-api.md",
    "automation/gobgp-cli.md",
    "automation/programmatic-clients.md",
    "automation/ci-and-testing.md",
  ] },
  { "Reference" = [
    "reference/index.md",
    "reference/rfc-support.md",
    "reference/gobgp-compatibility.md",
    "reference/configuration-reference.md",
  ] },
  { "Contributing" = "contributing.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/network"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep orange"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep orange"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/osrg/rustybgp"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
